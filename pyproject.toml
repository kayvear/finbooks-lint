[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finbooks-lint"
version = "0.1.0"
description = "Financial books & records validation system"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "claude-agent-sdk>=0.1.39",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "fpdf2>=2.8",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=20.0",
    "faker>=37.0",
    "python-dateutil>=2.9",
    "anyio>=4.9",
    "rich>=14.0",
    "typer>=0.16",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1",
    "ruff>=0.11",
]

[project.scripts]
finbooks-generate  = "finbooks.datagen.pipeline:main"
finbooks-statement = "finbooks.statements.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finbooks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
